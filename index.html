<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            function getComputerChoice() {
                let cc = ["rock", "paper", "scissors"];
                let compAnswer = Math.floor(Math.random() * cc.length);
                return cc[compAnswer];
            };

            function getHumanChoice() {
                let startingQuestion = prompt("What will you choose? Rock, Paper or Scissors?");
                let hc = startingQuestion;
                let humanAnswer = hc.toLowerCase();
                return humanAnswer;
            };
            
            let humanScore = 0;
            let computerScore = 0;

            function playRound(computerChoice, humanChoice) {
                if (humanChoice === computerChoice) {
                    console.log(`Oh, it's a draw. you both pulled ${humanChoice}.\nScore Card\nHuman: ${humanScore}\nComputer: ${computerScore}`);
                } else if ((humanChoice == 'rock' && computerChoice == 'scissors') || (humanChoice == 'paper' && computerChoice == 'rock') || (humanChoice == 'scissors' && computerChoice == 'paper')) {
                    humanScore++;
                    console.log(`You win! You threw ${humanChoice} and the opponent threw ${computerChoice}.\nScore Card\nHuman: ${humanScore}\nComputer: ${computerScore}`);
                } else {
                    computerScore++;
                    console.log(`Oh, dear, you lose this round! You threw ${humanChoice} and the opponent threw ${computerChoice}.\nScore Card\nHuman: ${humanScore}\nComputer: ${computerScore}`);
                };
            };

            let round = 1;
            function playGame() {
                if (round <= 5) {
                    const humanPick = getHumanChoice();
                    const computerPick = getComputerChoice();
                    playRound(computerPick, humanPick);
                    round += 1;
                    playGame();
                } else {
                    if (humanScore > computerScore) {
                        let finalWordWin = prompt(`You Win! The Final score is H:${humanScore} - C:${computerScore}. Would you like to go again? Yes or No.`);
                        let whoc = finalWordWin.toLowerCase();
                        if (whoc === 'yes') {
                            round = 1;
                            humanScore = 0;
                            computerScore = 0;
                            playGame();
                        } else {
                            console.log("Kay, catch you later champ!");
                        };

                    } else if (computerScore > humanScore) {
                        let finalWordLose = prompt(`You Lose! The Final score is H:${humanScore} - C:${computerScore}. Would you like to go again? Yes or No.`);
                        let lhoc = finalWordLose.toLowerCase();
                        if (lhoc === 'yes') {
                            round = 1;
                            humanScore = 0;
                            computerScore = 0;
                            playGame();
                        } else {
                            console.log("Kay, catch you later!");
                        };
                    } else {
                        console.log("Somehow it's a draw.")
                    };
                };
            };

            playGame();
        </script> 
    </body>
</html>
